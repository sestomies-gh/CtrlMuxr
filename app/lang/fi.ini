an.s.directmode=Kokeile Mode Direct (lepo minimissä).
an.s.combine=Kokeile yhtä yhdistettyä poljinakselia kaasulle + jarrulle (Valmis asettelu: yhdistetty poljinakseli Y).
an.s.identity=Viimeinen keino: Logitech-identiteetti ([Identity]).
an.s.btn=Nappia {0} ei hyväksytty. Kokeile toista numeroa: {1}.
an.s.caps=Jos mikään numero ei toimi: [Caps] MaxButtons=12 ja ClearFlags=A (heksadesimaali; INI-välilehti).
; --- tallennuspaikka, poisto, asennuksen purku (lisätty 2026-10-25)
game.remove=Poista listalta
game.uninstall=Poista proxy…
tt.remove=Poistaa valitun pelin listalta. Sovellus kysyy, poistetaanko myös sen säilyttämät asetukset (automaattiset varmistukset, omat tallennukset). Pelin kansioon ei kosketa.
tt.uninstall=Poistaa pelin kansiosta proxy-DLL:n, työkopion dinput_proxy.ini:n ja proxyn lokitiedostot. Asetukset jäävät sovelluksen data-kansioon ja palaavat, kun lisäät pelin uudelleen.
game.install=Asenna proxy…
tt.install=Asentaa proxyn takaisin pelin kansioon ja palauttaa sovelluksen tallentamat viimeisimmät asetukset (dinput_proxy.ini). Näkyy vain, kun kansiossa ei ole proxya.
add.title.reinstall=Asenna proxy – {0}
rm.confirm=Poistetaanko "{0}" listalta?\n\nPoista = poista listalta ja poista myös sovelluksen tälle pelille säilyttämät asetukset (automaattiset varmistukset ja omat tallennukset).\nSäilytä = poista vain listalta; varmistukset ja omat tallennukset säilyvät (ne palaavat, jos lisäät pelin uudelleen samalla nimellä).\n\nPelikansioon ei kosketa.
rm.delete=Poista
rm.keep=Säilytä
rm.proxyleft=Huom: proxy (dinput.dll) ja dinput_proxy.ini jäävät pelin kansioon ja toimivat pelissä edelleen. Jos haluat pelin puhtaaksi, käytä ensin "Poista proxy…".
un.none=Kansiosta {0} ei löytynyt CtrlMuxr-proxy-DLL:ää.
un.confirm=Poistetaanko pelin "{0}" proxy?\n\nPelin kansiosta poistetaan: {1}, dinput_proxy.ini ja proxyn lokitiedostot (dinput_<numero>.log). Jos asennus tallensi pelin oman DLL:n (.orig_…), se palautetaan.\n\nAsetukset säilyvät sovelluksessa ja palaavat, kun lisäät pelin uudelleen.
un.done=Pelin "{0}" proxy poistettiin.\n\nPoistetaanko peli myös listalta?
an.a.3=pelissä ei ole tällaista asetusta
an.s.handdigital=Vanhat pelit eivät välttämättä ota käsijarrua analogisena akselina. Vaihda käsijarrun rivin Mode-arvoksi "Digital: akseli → nappi" ja valitse napin numero.
an.q=Mitä peli hyväksyi, kun mappasit ohjaimet sen valikossa? (Ei kokeiltu / hyväksyi / ei hyväksynyt / pelissä ei ole tällaista asetusta – silloin mappaamista ei tarvita)
