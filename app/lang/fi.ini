vd.preset.apply=Käytä asettelu
vd.preset0.desc=Valitse asettelu nähdäksesi, mitä se tekee. Taulukko muuttuu vasta, kun painat Käytä asettelu ja vahvistat. Jos peli vaatii tietyn ratin (Logitech, MOMO, SideWinder), valitse se Identityksi Lisäasetukset-välilehdellä.
vd.preset3.desc=Jokainen pedaali omalle akselilleen (kaasu Y, jarru Z, kytkin Rx, käsijarru Ry), lepo keskellä. Käytä, kun peli haluaa pedaalit erikseen mutta tulkitsisi akselin minimin painetuksi.
vd.preset2.desc=Kaasu ja jarru yhdelle akselille Y (kaasu → min, jarru → max, lepo keskellä), kuten Logitech-ratit. Käytä, kun peli odottaa yhtä pedaaliakselia. Käsijarru ja napit asetat itse (Virtuaalilaite- ja Napit-välilehdet). Jos peli vaatii tietyn ratin, valitse se Identityksi Lisäasetukset-välilehdellä.
tt.vd.presetapply=Täyttää taulukon valitulla asettelulla Laitteet-välilehdellä antamillasi nimillä. Kysyy ensin vahvistuksen.
vd.modedesc.none=Valitse rivi nähdäksesi, mitä sen tila tekee.
mode.mask=Peitä (pidä keskellä)
mode.desc.0=Suora: lähde menee sellaisenaan. Pedaali: lepo = minimi, pohjassa = maksimi. Jos lähde on laitteen oma akseli (harmaa teksti), mitään ei muuteta.
mode.desc.1=Puoliakseli +: lepo = keskellä, pohjassa = maksimi. Käytä, kun peli tulkitsee akselin minimin "painetuksi" tai kun pedaalit halutaan omille akseleilleen.
mode.desc.2=Puoliakseli −: lepo = keskellä, pohjassa = minimi. Sama kuin edellinen, mutta toiseen suuntaan (esim. jarru vastakkaiseen suuntaan kuin kaasu).
mode.desc.3=Jaa: yläpuolisko: lähdeakselin ylempi puoli (keskeltä maksimiin) venytetään koko alueelle. Vain keskitetylle lähteelle (esim. yhdistetty pedaaliakseli), jonka haluat jakaa kahdeksi akseliksi.
mode.desc.4=Jaa: alapuolisko: sama kuin yläpuolisko, mutta lähdeakselin alempi puoli (keskeltä minimiin). Pari yläpuoliskolle.
mode.desc.5=Yhdistä kaksi akselia: kaasu ja jarru yhdelle akselille. Kaasu vetää kohti minimiä, jarru kohti maksimia, lepo keskellä. Valitse myös toinen lähde (jarru). Käännä vaihtaa puoliskot keskenään kokonaisuutena (kaasu kohti maksimia, jarru kohti minimiä); polkimia ei voi kääntää erikseen tässä.
mode.desc.6=Peitä: peli saa tältä akselilta aina keskiarvon. Käytä laitteen staattisille akseleille, jotka ovat jumissa ääriasennossa ja saavat pelin luulemaan, että jotain on painettu (esim. Mozan ylimääräiset akselit).
mode.warn.split=⚠ Lähde näyttää pedaalilta. Jaa-tilat vaativat keskitetyn lähteen; pedaalin lepoasento on reunassa, joten toinen puolisko ei liiku.
steer.confirm=Ohjaus (X) tulisi jatkossa laitteelta {1}, ei pelin pääohjaimelta {0}.\n\nPääohjain {0} jää silloin vain voimantuntoefektien (FFB) laitteeksi: sen oma ohjaus ei mene peliin, ja voimat eivät vastaa ohjausta. Jos haluat, että {1} on FFB-laite, poista tämän pelin proxy ja lisää peli uudelleen valiten {1} pääohjaimeksi.\n\nJatketaanko silti?
mode.warn.combine=⚠ Valitse toinen lähde, muuten riviä ei tallenneta.
mode.warn.steer=⚠ Ohjaus (X) ei tule pelin pääohjaimen ({0}) omalta X-akselilta. FFB kulkee silti pelin ja pääohjaimen välillä, joten voimat eivät vastaa ohjausta. Jos pääohjain ei tuota FFB:tä, tällä ei ole väliä.
p.desc.dz=Keskialue, jossa pienet liikkeet ohitetaan. Suurempi arvo = jäykempi keskikohta ja vähemmän nykimistä. Tarkoitettu ohjaukselle.
p.desc.expo=Pehmentää vastetta keskellä: 0 % = suoraviivainen, suuri arvo = pienet liikkeet vaikuttavat vähän ja reunat enemmän.
p.desc.gain=Ulostulon kerroin. 100 % = muuttumaton; alle 100 % = akseli ei yllä reunaan; yli 100 % = reuna saavutetaan ennen kuin ohjain on ääriasennossa.
p.desc.adz=Kumoaa pelin oman kuolleen alueen: ulostulo hyppää sen yli heti kun liikutat ohjainta. Käytä, kun peli ei reagoi pieniin liikkeisiin.
p.desc.lead=Lisää liikenopeuteen verrannollisen termin ja kumoaa pelin syötteen tasoituksen (hidas tuntuma). Suurempi arvo = nopeampi vaste, mutta voi aiheuttaa värinää.
shape.intro=Säätää, miten yhden akselin liike muuttuu ennen kuin peli näkee sen. Valitse ensin laite ja akseli ylhäältä.\nSäädöt on tarkoitettu keskitetylle akselille (ohjaus); pedaalille ne sopivat vain, jos pedaali on puoliakseli tai yhdistetty.\nArvot tallentuvat pelin dinput_proxy.ini-tiedoston [Shape]-osioon. Käynnissä oleva peli ottaa ne käyttöön heti; jos peli ei ole käynnissä, muutokset ovat luonnos, kunnes painat Tallenna.
