an.s.none=Ei ehdotettavaa: yhtään ohjainta ei ole merkitty "ei hyväksynyt".
an.s.nocarrier=Mikään taulukko ei kuljeta ohjainta {0}. Nimeä se Laitteet-välilehdellä ja liitä akseli (Virtuaalilaite) tai mappaa nappi (Napit).
an.s.steer=Ohjaus on ratin oma akseli X. Tarkista [Identity], [Hide] ja ettei ratti ole piilotettu. Kokeile Logitech-asettelua viimeisenä.
an.s.nolog=Vertailtavaa lokia ei ole: pelaa kerran ja analysoi uudelleen.
an.s.moved=Lokin mukaan peli sai liikkuvia arvoja akselilla {0}. Liitos toimii; peli itse ei hyväksy tätä akselia tai sen muotoa.
an.s.notmoved=Lokissa ei näy liikettä akselilla {0}: liikuta ohjainta mappauksen aikana, tai lähde on väärä.
