tab.buttons=Napit
mode.digital=Digital: akseli → nappi
mode.desc.7=Digital: akseli toimii nappina. Valitse napin numero (B1–B32) ja kohta (% akselista), jossa nappi on painettu; Käännä = painettu kun akseli on alle tämän kohdan. Itse akselia ei välitetä (pidetään keskellä). Käytä käsijarruun, kun peli haluaa sen nappina.
mode.warn.digital=⚠ Valitse lähdeakseli ja napin numero, muuten riviä ei tallenneta.
tt.clash.digital=Napit-välilehti mappaa myös pelin napin {0}.\nMolemmat toimivat (painettu, kun jompikumpi on); tarkista, että se on tarkoitus.
vd.btn.choose=(nappi)
btn.intro=Muiden laitteiden napit (esim. vaihteenvaihtaja) pelin näkemän ratin nappeina. Napit numeroidaan ykkösestä (B1), samoin kuin live-ruudukoissa ja INI:ssä. Rivien määrää voi muuttaa yllä (8, 16, 32 tai 48). Akseli → nappi (käsijarru) tehdään Virtuaalilaite-välilehdellä tilalla "Digital". Oikealla oleva laatikko näyttää, mitä peli näkee: se muuttuu vihreäksi, kun pelin nappi on painettu, joten testaa mappaus painamalla laitteen lähdenappia. Usealla rivillä voi olla sama pelin nappi: se on painettu, kun mikä tahansa niiden lähdenapeista on painettu (esim. vaihde ylös kahdesta eri napista).
btn.h.out=→ Pelin nappi
btn.h.src=Lähdenappi
btn.mapnamed=Mappaa nimeämäsi napit samoilla numeroilla
btn.rows=Näytettävät rivit:
tt.btn.rows=Kuinka monta riviä taulukossa näytetään: 8, 16, 32 tai 48. Vain näkymä muuttuu: peli näkee mapatut napit riippumatta rivimäärästä. Käytössä olevat rivit näkyvät aina. Valinta koskee vain tätä peliä; seuraava peli alkaa 8 rivistä.
tt.clash.btn=Käytössä myös Virtuaalilaite-välilehden Digital-akselilla: {0}.\nMolemmat toimivat (painettu, kun jompikumpi on); tarkista, että se on tarkoitus.
btn.clear=Tyhjennä kaikki
tt.btn.clear=Tyhjentää taulukon jokaisen rivin, esimerkiksi ennen mappauksen aloittamista alusta. Virtuaalilaite-välilehden Digital-akseleihin ei kosketa. Kysyy ensin vahvistuksen.
msg.btnclear=Tyhjennetäänkö tämän pelin Napit-välilehden kaikki rivit?\n(Virtuaalilaite-välilehden Digital-akseleihin ei kosketa. Muutoksen voi perua: Peru muutokset tai Kumoa viimeisin tallennus.)
btn.onlynamed=Vain nimeämäni napit
tt.btn.onlynamed=Lyhentää lähdelistaa: listalla ovat vain Laitteet-välilehdellä nimeämäsi napit ja jo mapatut napit.\nIlman tätä listalla on jokainen laitteen nappi (enintään 32, eli kaikki, mitä proxy lukee).
btn.mapped=Lisätty {0} nappia. Ohitettu {1}: numero oli jo käytössä tai taulukko on täynnä.
btn.mapped.offline=Ohitettu (ei kytketty, ei mappausta tässä pelissä): {0}.
