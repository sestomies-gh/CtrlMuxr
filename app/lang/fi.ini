; --- Lisäasetukset-välilehti, nappien live-värjäys (lisätty 2026-10-25)
tab.advanced=Lisäasetukset
adv.intro=Nämä asetukset ovat korjauksia ongelmatilanteisiin: peli ei näe ohjainta, ei hyväksy nappeja tai voimapalaute on väärä. Jos peli toimii, älä muuta mitään. Jokaisen asetuksen vieressä oleva ?-merkki avaa pidemmän selityksen (vie hiiri päälle tai napsauta). Asetukset, joissa lukee "vaatii pelin uudelleenkäynnistyksen", luetaan pelin käynnistyessä.
adv.restart=⟳ Vaatii pelin uudelleenkäynnistyksen.
adv.live=Tulee voimaan heti, myös pelin ollessa käynnissä.
adv.maxbtn=Nappimäärän raja (MaxButtons)
adv.maxbtn.d=Ongelma: peli ei hyväksy nappeja ohjausvalikossa. Syy: jotkin vanhat pelit eivät osaa mapata nappeja, kun laitteella on niin paljon (oikeasti niitä raportoidaan 128). Asetus kertoo pelille, että ratissa on vain näin monta nappia. Tyypillinen arvo on 12. 0 = pois (peli näkee kaikki napit).
adv.flags=Piilota laitteen ominaisuusliput (ClearFlags)
adv.flag.dev=Polled device
adv.flag.fmt=Polled data format
adv.flags.d=Ongelma: napit eivät mappaudu pelin ohjausvalikossa. Syy: jotkin vanhat pelit valitsevat huonomman tavan lukea laitetta, joka ilmoittaa tarvitsevansa "pollausta". Nämä kaksi valintaa piilottavat väitteen peliltä. Valitse molemmat yhdessä nappimäärän rajan kanssa. Jos kaikki toimii, jätä molemmat pois.\n\nINI:ssä kaksi valintaa tallentuu yhtenä lukuna heksadesimaalina, [Caps] ClearFlags: ei kumpaakaan = ei riviä, vain Polled device = 2, vain Polled data format = 8, molemmat = A (2 + 8 = 10 kymmenjärjestelmässä, heksadesimaalina kirjoitettuna A).
adv.ignoredz=Ohita pelin oma kuollut alue (IgnoreDeadzone)
adv.ignoredz.d=Ongelma: peli tuntuu kuolleelta ratin keskellä. Syy: monet pelit asettavat akselin keskelle oman kuolleen alueensa. Kun tämä on päällä, proxy poistaa sen asetuksen. Aseta tarvittaessa oma kuollut alue Säädöt-välilehdellä (dz).
adv.autocoop=Varajärjestely, jos yksinoikeus ei onnistu (AutoCoop)
adv.autocoop.d=Voimapalaute vaatii, että peli saa ratin yksinoikeudella. Jos jokin muu ohjelma estää sen, proxy kokeilee ensin kevyempää tilaa, jotta ohjaus toimii, ja yrittää yksinoikeutta uudelleen muutaman kerran myöhemmin. Jätä päälle; kytke pois vain, jos nämä yritykset aiheuttavat ongelmia.
adv.nonexcl=Älä käytä yksinoikeutta lainkaan (NonExclusive)
adv.nonexcl.d=Ongelma: peli ei saa ohjainta lainkaan (loki: Acquire … 80070005, heksadesimaalimuotoinen virhekoodi), vaikka mikään muu ei pidä rattia. Asetus avaa ratin jaettuna, jolloin ohjaus toimii, mutta voimapalaute poistuu. Kokeile ensin Yksinoikeustestiä ja yllä olevia asetuksia.
adv.boost=Voimapalautteen voimakkuus (Boost, %)
adv.boost.d=Skaalaa kaikkien pelin ratille lähettämien voimien voimakkuutta. 100 % on pelin oma voimakkuus. Nosta, jos voimat tuntuvat heikoilta; laske, jos ne ovat liian voimakkaita tai ratti leikkaa. Ratin oma ohjelmisto (esim. Moza Pit House) vaikuttaa voimiin myös, joten säädä ensin se. Tulee voimaan heti, myös pelin ollessa käynnissä.
adv.identity=Minä laitteena peli näkee ratin (Identity)
adv.identity.none=Oikea laite (oletus)
adv.identity.d=Saa pelin uskomaan, että ratti on tunnettu Logitech- tai Microsoft-ratti (Driving Force Pro, MOMO Racing, SideWinder Force Feedback Wheel). Jotkin pelit tuntevat vain tällaisia rattia ja antavat niille kunnolliset oletusohjaukset. Valitse tämä tässä, kun peli vaatii tietyn ratin.
adv.devtype=Laitetyyppi (DevType)
adv.devtype.none=Oikea tyyppi (oletus)
adv.devtype.joy=Joystick (10114, heksadesimaali)
adv.devtype.d=Jotkin pelit antavat mapata ohjaimet vain, kun laite ilmoittaa olevansa joystick, toiset vain kun se on ratti. Ratin oikea tyyppi on "ratti". Vaihda joystickiksi vain, jos peli ei muuten anna mapata.
tt.btn.led=Mitä peli näkee: vihreä kun tämä pelin nappi on painettu (lasketaan laitteistasi, kun peli ei ole käynnissä; pelin ollessa käynnissä oikea arvo).
start.title=Aloita tästä
start.1=Paina "{0}" (vasemmalla alhaalla) ja valitse pelin .exe. CtrlMuxr laittaa pelin kansioon pienen proxy-tiedoston; muuta ei Windowsissa muuteta.
start.2={0}-välilehti: liikuta jokaista akselia ja paina jokaista nappia ja kirjoita niille nimet (esim. Kaasu, Jarru, Vaihde ylös). Nimien avulla vaihe 3 täyttyy itsestään.
start.3={0}-välilehti: valitse valmis asettelu (tai aseta lähteet itse) ja paina {1}. Käynnistä peli: se näkee yhden ohjaimen.
start.help=Avaa ohje (F1)
add.wheel.hint=⚠ Valitse ratti: ohjain, jossa on voimapalaute (FFB). Peli näkee vain tämän ohjaimen; muut ohjaimet (polkimet, vaihteenvaihtaja) piilotetaan pelistä ja yhdistetään siihen. Valintaa ei voi vaihtaa myöhemmin: jos haluat käyttää toista ohjainta, poista proxy asetuksineen ("Poista proxy…", sitten "Poista listalta" ja vastaa Kyllä, jolloin asetukset poistetaan) ja lisää peli uudelleen toisella ohjaimella.
add.ffbtag=voimapalaute (FFB)
add.suggested=ehdotettu
add.wheel.other=Muu (kirjoita VID:PID, heksadesimaali):
btn.nonames=Nimettyjä nappeja ei vielä ole. Laitteet-välilehdellä paina laitteen nappia ja kirjoita sille nimi (esim. Vaihde ylös); lisää sitten nimetyt napit tähän vasemman napin avulla.
start.1.t=Vaihe 1 – Lisää peli
start.2.t=Vaihe 2 – Nimeä akselit ja napit
start.3.t=Vaihe 3 – Valitse asettelu
start.hide=Piilota opaste
pa.title=Mikä akseli on mikä?
pa.intro=Asettelu tarvitsee tiedon kaasu-, jarru-, kytkin- ja käsijarruakseleista. Antamissasi nimissä ei ole tavallisia sanoja (kaasu, jarru …), joten valitse ne tässä. Kytkin ja käsijarru ovat valinnaisia.
pa.gas=Kaasu
pa.brake=Jarru
pa.clutch=Kytkin (valinnainen)
pa.hand=Käsijarru (valinnainen)
banner.draft={0} – ei käynnissä: muutokset ovat luonnos, kunnes painat Tallenna
btn.h.led=Peli näkee
vd.live.preview=Peli ei käynnissä - esikatselu: lasketaan laitteistasi samoilla säännöillä kuin proxy (Säädöt-välilehden "lead" ei mukana).
tip.axisbtn=akseli nappina
adv.gainmag=Voima magnitudina (GainAsMagnitude)
adv.gainmag.d=Ongelma: ratti vetää täydellä voimalla yhteen suuntaan, esimerkiksi pätkän alussa tai törmäyksen jälkeen. Syy: jotkin pelit (esim. Colin McRae Rally 1 ja 2) muuttavat voimapalautteen voimakkuutta vain efektin gainilla, ja osa ratin ajureista (esim. Moza R9) ei noudata käynnissä olevan efektin gain-muutoksia, joten efekti jää täydelle voimalle. Tämä asetus lähettää voimakkuuden magnitudina, jota ajuri noudattaa. Kokeile tätä ensin.
adv.blocksine=Estä sini-efekti (BlockSine)
adv.blocksine.d=Ongelma: voimapiikit ovat voimakkaampia toiseen suuntaan kuin toiseen, vaikka "Voima magnitudina" on päällä. Syy: jotkin ratit (esim. Moza R9) toistavat jaksollisen (sini) efektin vetona yhteen suuntaan. Colin McRae Rally käyttää sitä moottorin ja tien tärinään. Tämä asetus estää sini-efektit: veto tasaantuu (Colin McRae Rallyssa Moza R9:llä symmetria parani), mutta tärinä katoaa.
warn.update=Päivitä proxy
warn.update.tt=Kopioi tämän sovelluksen nykyisen proxy-tiedoston pelikansion vanhan päälle (pelin pitää olla suljettuna). Asetuksia ei muuteta.
msg.proxyrunning=Peli "{0}" on käynnissä. Sulje se ensin ja päivitä sitten proxy.
adv.group.ffb=Voimapalaute (FFB) – ongelmatilanteisiin
adv.group.compat=Napit ja laitteen yhteensopivuus – ongelmatilanteisiin
adv.group.ffb.note=Näitä ei tarvita, jos voimapalaute toimii normaalisti. Kokeile vain, jos ratti vetää yhteen suuntaan, voimat ovat liian heikot tai voimapalaute puuttuu.
adv.group.compat.note=Nämä auttavat vanhoihin peleihin, jotka eivät hyväksy nappeja, tuntuvat kuolleilta ratin keskellä tai tulkitsevat ohjaimen väärin. Jos peli toimii, älä muuta.
adv.gainmag.s=Kokeile, jos ratti vetää täydellä voimalla yhteen suuntaan, esimerkiksi pätkän alussa.
adv.blocksine.s=Kokeile, jos veto on yhä epäsymmetristä. Moottorin ja tien tärinä poistuu.
adv.boost.s=Kokeile, jos voimat tuntuvat liian heikoilta tai liian voimakkailta. 100 % = muuttumaton.
adv.autocoop.s=Pidä päällä. Auttaa, kun jokin muu ohjelma estää voimapalautteen. Ei vaikutusta (harmaa), kun NonExclusive on päällä.
adv.nonexcl.s=⚠ Viimeinen keino: poistaa voimapalautteen. Käytä vain, jos peli ei saa ohjainta lainkaan.
adv.maxbtn.s=Kokeile ensin, jos peli ei hyväksy nappeja ohjausvalikossa. Tyypillinen arvo on 12.
adv.flags.s=Kokeile näitä, jos napit eivät mappaudu vielä nappimäärän rajankaan kanssa (valitse molemmat).
adv.ignoredz.s=Kokeile, jos peli tuntuu kuolleelta ratin keskellä.
adv.identity.s=Kokeile, jos peli tuntee vain tietyt Logitech-ratit ja antaa niille parhaat oletusohjaukset.
adv.devtype.s=Kokeile, jos peli ei anna mapata ohjainta (joystick vai ratti).
