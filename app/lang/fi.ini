tt.bar.discard=Hylkää tallentamattomat muutokset ja lataa asetukset tiedostosta uudelleen.
tt.bar.undo=Peruu yhden tallennuksen: asetustiedosto palaa tilaan, jossa se oli ennen viimeisintä tallennusta. Uusi painallus peruu seuraavan tallennuksen. Sulkeissa oleva luku kertoo, montako tallennusta voi vielä kumota (enintään 30; unohtuvat pelin vaihdossa ja sovelluksen sulkemisessa).
