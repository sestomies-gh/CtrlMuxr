an.btn=Analysoi viimeisin pelikerta…
an.btn.tip=Lukee pelin lokin ja kertoo, mitä kannattaa kokeilla. Painike hehkuu, kun lokissa on jotain, mikä kannattaa tietää.
an.log=Lokita myös kun CtrlMuxr on kiinni
an.log.tip=Proxy lokittaa vain, kun CtrlMuxr on käynnissä, joten valmis asetus ei hidasta peliä. Laita päälle, jos haluat lokittaa valitun pelin myös ilman CtrlMuxria, esimerkiksi ongelman kaappaamiseksi, joka ilmenee vain kun peli käynnistetään Steamistä. Tulee voimaan parissa sekunnissa. Lokia rajoitetaan (noin 200 riviä sekunnissa, enintään 5 Mt); jätä pois päältä, kun sitä ei tarvita. Ongelmat tallentuvat aina tiedostoon dinput_errors.log.
an.title=Analyysi – {0}
an.intro=Loki: {0} ({1}). Se, mitä proxy antoi pelille. Loki ei kerro, mitä peli hyväksyi, joten vastaa alla oleviin kysymyksiin.
an.nolog=Lokia ei vielä ole: käynnistä peli kerran proxy asennettuna ja sulje se.
an.f.none=Lokissa tai asetuksissa ei ole mitään outoa.
an.f.stale=Asetuksia muutettiin viimeisen pelikerran ({0}) jälkeen. Käynnistä peli uudelleen ja analysoi sitten.
an.f.bad=Proxy ohitti tämän INI-rivin: {0}
an.f.srcfail=Lähdelaitetta ei voitu käyttää: {0} – kytke se tai sulje sitä pitävä ohjelma.
an.f.acq=Ratin yksinoikeutta ei saatu (ei voimapalautetta): {0} – aja Yksinoikeustesti; jos se epäonnistuu, ota ensin Steamissa pois päältä "Enable Steam Input for …", ja jos se ei riitä, sulje Steam kokonaan taustalta ja testaa uudelleen.
an.f.acqlost=Laite menetti hetkeksi pääsyn ({0}) mutta sai sen takaisin. Yleensä pelin ikkuna ei ollut etualalla (esim. Alt+Tab). Ei toimenpiteitä.
an.f.notlisted=Peli ei listannut laitetta {0} lainkaan. Se voi olla piilotettu [Hide]:ssa tai kytkemättä.
an.f.wheelhidden=Ratti {0} on piilotettu pelin näkymästä ([Hide]). Poista se [Hide]-listasta.
an.f.notopened=Peli listasi laitteen {0}, mutta ei avannut sitä: peli ei valinnut tätä ohjainta. Tarkista identiteetti ([Identity]) tai kokeile Logitech-asettelua.
an.f.hiddenunused=Huom: olet piilottanut laitteen "{0}" kokonaan: siitä ei ole mapattu mitään, joten peli ei näe sitä.
an.f.unmapped=Liikkui pelikerran aikana, mutta ei ole mapattu: {0}.
an.f.nopass=Akselin {0} lähde liikkui, mutta pelin akseli ei muuttunut. Liitos ei ehkä pääse peliin (tarkista Mode ja Invert).
an.f.nosrc=Muilta laitteilta ei kirjautunut arvoja: niitä ei painettu tai liikutettu, tai loki on mappausta edeltävältä ajalta.
an.c.steer=Ohjaus
an.c.throttle=Kaasu
