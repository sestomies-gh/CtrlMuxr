p.center=Keskipiste
p.desc.center=Raakaarvo, jonka peli katsoo keskikohdaksi. Yleensä 32768. Käytä, jos ratti ei lepää tarkalleen keskellä: aseta ratti keskelle ja paina "Käytä nykyistä asentoa". Tarkoitettu ohjaukselle.
shape.reset=Nollaa
shape.setcurrent=Käytä nykyistä asentoa
shape.readfail=Laitetta ei voitu lukea. Tarkista, että se on kytketty (ja ettei peli pidä sitä).
tt.shape.reset=Palauttaa tämän arvon oletukseen.
tt.shape.setcurrent=Lukee valitun akselin nykyisen asennon ja käyttää sitä keskipisteenä.
dlg.yes=Kyllä
dlg.no=Ei
dlg.cancel=Peruuta
dlg.ok=OK
