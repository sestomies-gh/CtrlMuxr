tip.axisbtn=axis to button
adv.gainmag=Strength as magnitude (GainAsMagnitude)
adv.gainmag.d=Problem: the wheel pulls to one side with full force, for example at the start of a stage or after a crash. Cause: some games (e.g. Colin McRae Rally 1 and 2) change the strength of the force-feedback effects only through their gain, and some wheel drivers (e.g. the Moza R9) ignore gain changes of an effect that is already playing, so the effect stays at full strength. This setting sends the strength as the effect's magnitude, which the driver does follow. Try this first.
adv.blocksine=Block the sine effect (BlockSine)
adv.blocksine.d=Problem: force spikes are stronger to one side than to the other, even with "Strength as magnitude" on. Cause: some wheels (e.g. the Moza R9) play a periodic (sine) effect as a pull to one side. Colin McRae Rally uses one for engine and road vibration. This setting blocks the sine effects: the pull evens out (in Colin McRae Rally with the Moza R9 the symmetry improved), but the vibration is gone.
warn.update=Update proxy
warn.update.tt=Copies this app's current proxy file over the one in the game folder (the game must be closed). The settings are not changed.
msg.proxyrunning=The game "{0}" is running. Close it first, then update the proxy.
adv.group.ffb=Force feedback (FFB) – for problems
adv.group.compat=Buttons and device compatibility – for problems
adv.group.ffb.note=You do not need these if force feedback works normally. Try them only if the wheel pulls to one side, the forces are too weak or force feedback is missing.
adv.group.compat.note=These help old games that do not accept the buttons, feel dead around the wheel centre or misread the controller. If the game works, change nothing.
adv.gainmag.s=Try this if the wheel pulls to one side with full force, for example at the start of a stage.
adv.blocksine.s=Try this if the pull is still uneven. The engine and road vibration disappear.
adv.boost.s=Try this if the forces feel too weak or too strong. 100 % = unchanged.
adv.autocoop.s=Keep this on. It helps when another program blocks force feedback. No effect (greyed) while NonExclusive is on.
adv.nonexcl.s=⚠ Last resort: removes force feedback. Use only if the game cannot get the controller at all.
adv.maxbtn.s=Try this first if the game does not accept the buttons in its control menu. Typical value: 12.
adv.flags.s=Try these if the buttons still do not map with the button limit (tick both).
adv.ignoredz.s=Try this if the game feels dead around the wheel centre.
adv.identity.s=Try this if the game only knows certain Logitech wheels and gives them the best default controls.
adv.devtype.s=Try this if the game will not let you map the controller (joystick or wheel).
