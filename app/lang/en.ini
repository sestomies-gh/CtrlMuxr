tab.advanced=Advanced
adv.intro=These settings are fixes for problem situations: the game does not see the controller, does not accept the buttons, or the force feedback is wrong. If the game works, change nothing. The ? next to each setting opens a longer explanation (hover or click). Settings marked "needs a game restart" are read when the game starts.
adv.restart=⟳ Needs a game restart.
adv.live=Takes effect at once, also while the game runs.
adv.maxbtn=Button count limit (MaxButtons)
adv.maxbtn.d=Problem: the game does not accept the buttons in its control menu. Cause: some old games cannot map buttons when a device has so many (128 are really reported). This tells the game the wheel has only this many buttons. A typical value is 12. 0 = off (the game sees all the buttons).
adv.flags=Hide device capability flags (ClearFlags)
adv.flag.dev=Polled device
adv.flag.fmt=Polled data format
adv.flags.d=Problem: the buttons do not map in the game's control menu. Cause: some old games choose a poorer way of reading a device that says it must be "polled". These two ticks hide that claim from the game. Tick both together with the button limit. If everything works, leave both unticked.\n\nIn the INI the two ticks are saved as one number in hexadecimal, [Caps] ClearFlags: neither ticked = no line, only Polled device = 2, only Polled data format = 8, both = A (2 + 8 = 10 in decimal, written A in hexadecimal).
adv.ignoredz=Ignore the game's own dead zone (IgnoreDeadzone)
adv.ignoredz.d=Problem: the game feels dead around the centre of the wheel. Cause: many games set a dead zone of their own around the centre of an axis. With this on, the proxy drops that setting. Set a dead zone yourself on the Tuning tab (dz) if you want one.
adv.autocoop=Fallback if exclusive access fails (AutoCoop)
adv.autocoop.d=Force feedback needs the game to hold the wheel exclusively. If another program prevents that, the proxy first tries a gentler mode so that the steering works, and tries exclusive access again a few times later. Leave this on; turn it off only if these attempts cause trouble.
adv.nonexcl=Never use exclusive access (NonExclusive)
adv.nonexcl.d=Problem: the game cannot get the controller at all (log: Acquire … 80070005, a hexadecimal error code) although nothing else holds the wheel. This opens the wheel in shared mode, so the steering works but force feedback is gone. Try the Exclusive access test and the settings above first.
adv.boost=Force feedback strength (Boost, %)
adv.boost.d=Scales the strength of all forces the game sends to the wheel. 100 % is the game's own strength. Raise it if the forces feel weak; lower it if they are too strong or the wheel clips. The wheel's own software (e.g. Moza Pit House) also affects the forces, so set that first. Takes effect at once, also while the game is running.
adv.identity=What the game sees the wheel as (Identity)
adv.identity.none=The real device (default)
adv.identity.d=Makes the game believe the wheel is a known Logitech or Microsoft wheel (Driving Force Pro, MOMO Racing, SideWinder Force Feedback Wheel). Some games only know such wheels and give them proper default controls. Choose it here when the game needs a particular wheel.
adv.devtype=Device type (DevType)
adv.devtype.none=The real type (default)
adv.devtype.joy=Joystick (10114, hexadecimal)
adv.devtype.d=Some games let you map controllers only when the device says it is a joystick, others only when it is a wheel. The wheel's real type is "wheel". Change it to joystick only if the game will not let you map otherwise.
tt.btn.led=What the game sees: green while this game button is pressed (calculated from your devices when the game is not running, the real value while it runs).
start.title=Getting started
start.1=Press "{0}" (bottom left) and choose the game's .exe. CtrlMuxr puts a small proxy file in the game folder; nothing else in Windows is changed.
start.2={0} tab: move each axis and press each button, and type a name for it (e.g. Throttle, Brake, Gear up). The names let step 3 fill itself in.
start.3={0} tab: choose a ready-made layout (or set the sources yourself) and press {1}. Start the game: it sees one controller.
start.help=Open the help (F1)
add.wheel.hint=⚠ Choose your wheel: the controller that has force feedback (FFB). The game sees only this controller; the other controllers (pedals, shifter) are hidden from the game and merged into it. It cannot be changed later: to use another controller, uninstall the proxy with its settings ("Uninstall proxy…", then "Remove from list" and answer Yes to delete the settings) and add the game again with the other controller.
