vd.preset.apply=Apply layout
vd.preset0.desc=Choose a layout to see what it does. The table only changes when you press Apply layout and confirm. If the game needs a particular wheel (Logitech, MOMO, SideWinder), choose it as the Identity on the Advanced tab.
vd.preset4.desc=For games that choose their controls by the wheel model (e.g. WRC 5). Throttle goes to Y, brake to Rz and clutch to S1, all inverted (rest at the maximum) as on a G27, and the unused axes are masked. Also sets the Identity (Advanced tab) to Logitech G27: restart the game. The G27 has no handbrake axis, so set the handbrake and the buttons yourself.
vd.preset3.desc=Each pedal on its own axis (gas Y, brake Z, clutch Rx, handbrake Ry), rest in the centre. Use when the game wants the pedals separately but would read an axis minimum as "pressed".
vd.preset2.desc=Gas and brake on one axis Y (gas → min, brake → max, rest in the centre), like Logitech wheels. Use when the game expects a single pedal axis. The handbrake and the buttons are set by you (Virtual device and Buttons tabs). If the game needs a particular wheel, choose it as the Identity on the Advanced tab.
tt.vd.presetapply=Fills the table with the selected layout using the names you gave on the Devices tab. Asks for confirmation first.
vd.modedesc.none=Select a row to see what its mode does.
mode.mask=Mask (hold at centre)
mode.desc.0=Direct: the source is passed on as it is. Pedal: rest = minimum, fully pressed = maximum. If the source is the device's own axis (grey text) nothing is changed.
mode.desc.1=Half axis +: rest = centre, fully pressed = maximum. Use when the game reads an axis minimum as "pressed", or to give each pedal its own axis.
mode.desc.2=Half axis −: rest = centre, fully pressed = minimum. Same as above but in the other direction (e.g. brake opposite to gas).
mode.desc.3=Split: upper half: the upper half of the source axis (centre to maximum) is stretched to the full range. Only for a centred source (e.g. a combined pedal axis) that you want to split into two axes.
mode.desc.4=Split: lower half: same as the upper half, but the lower half of the source axis (centre to minimum). The pair of the upper half.
mode.desc.5=Combine two axes: gas and brake on one axis. Gas pulls towards the minimum, brake towards the maximum, rest in the centre. Also choose the second source (brake). Invert swaps the two halves as a whole (gas towards the maximum, brake towards the minimum); the pedals cannot be reversed one by one here.
mode.desc.6=Mask: the game always gets the centre value from this axis. Use for a device's static axes that are stuck at an extreme and make the game think something is pressed (e.g. the extra axes of a Moza).
mode.warn.split=⚠ The source looks like a pedal. Split modes need a centred source; a pedal rests at the edge, so the other half does not move.
mode.warn.steer=⚠ Steering (X) does not come from the X axis of the game's main device ({0}). Force feedback still goes between the game and the main device, so the forces do not match the steering. If the main device has no force feedback, this does not matter.
steer.confirm=Steering (X) would come from {1}, not from the game's main device {0}.\n\nThe main device {0} would then only run the force feedback (FFB): its own steering does not reach the game and the forces do not match the steering. If you want {1} to be the FFB device, remove this game's proxy and add the game again, choosing {1} as the main device.\n\nContinue anyway?
mode.warn.combine=⚠ Choose the second source, otherwise the row is not saved.
p.desc.dz=Centre area where small movements are ignored. Larger = stiffer centre and less jitter. Meant for steering.
p.desc.expo=Softens the response near the centre: 0 % = linear; a high value makes small movements count less and the edges more.
p.desc.gain=Output multiplier. 100 % = unchanged; below 100 % the axis does not reach the edge; above 100 % the edge is reached before the device is at its limit.
p.desc.adz=Cancels the game's own dead zone: the output jumps over it as soon as you move the device. Use when the game does not react to small movements.
p.desc.lead=Adds a term proportional to the speed of movement and cancels the game's input smoothing (sluggish feel). Larger = faster response, but can cause jitter.
shape.intro=Adjusts how the movement of one axis changes before the game sees it. Choose the device and axis above first.\nThe settings are meant for a centred axis (steering); for a pedal they only fit if it is a half axis or a combined axis.\nValues are stored in the [Shape] section of the game's dinput_proxy.ini. A running game uses them at once; if the game is not running the changes are a draft until you press Save.
