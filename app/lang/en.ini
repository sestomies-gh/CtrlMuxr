; --- buttons tab and Digital mode (added 2026-10-25)
tab.buttons=Buttons
mode.digital=Digital: axis → button
mode.desc.7=Digital: the axis works as a button. Choose the button number (B1–B32) and the point (% of the axis) where it counts as pressed; Invert = pressed when the axis is below that point. The axis itself is not passed on (held at the centre). Use for a handbrake when the game wants it as a button.
mode.warn.digital=⚠ Choose the source axis and the button number, otherwise the row is not saved.
tt.clash.digital=The Buttons tab also maps game button {0}.\nBoth work (pressed when either is); check that this is intended.
vd.btn.choose=(button)
btn.intro=Buttons of your other devices (e.g. the gear shifter) as buttons of the wheel the game sees. Buttons are numbered from 1 (B1), the same as in the live grids and in the INI. The number of rows can be changed above (8, 16, 32 or 48). Axis → button (handbrake) is made on the Virtual device tab with Mode "Digital". The box on the right shows what the game sees: it turns green while the game button is pressed, so press a source button on the device to test the mapping. Several rows can have the same game button: it is pressed when any of their source buttons is (e.g. gear up from two different buttons).
btn.h.out=→ Game button
btn.h.src=Source button
btn.mapnamed=Map the buttons you have named, with the same numbers
btn.rows=Rows shown:
tt.btn.rows=How many rows the table shows: 8, 16, 32 or 48. Only the view changes: the game sees the buttons you map, whatever the number of rows. Rows that are in use are always shown. The choice applies to this game only; the next game starts at 8 rows.
tt.clash.btn=Also used by a Digital axis on the Virtual device tab: {0}.\nBoth work (pressed when either is); check that this is intended.
btn.clear=Clear all
tt.btn.clear=Empties every row of this table, e.g. before mapping from scratch. The Digital axes on the Virtual device tab are not touched. Asks for confirmation first.
msg.btnclear=Clear all rows of the Buttons tab for this game?\n(Digital axes on the Virtual device tab are not touched. You can take it back: Discard changes or Undo last save.)
btn.onlynamed=Only buttons I have named
tt.btn.onlynamed=Shortens the source list: only buttons you have named on the Devices tab, and buttons that are already mapped, are listed.\nWithout this, every button the device has is listed (at most 32, the most the proxy reads).
btn.mapped=Added {0} button(s). Skipped {1}: the number was already used or the table is full.
btn.mapped.offline=Skipped (not connected, no mapping in this game): {0}.
; --- log analysis (added 2026-10-25)
an.btn=Analyse last session…
an.btn.tip=Reads the game's log and tells what to try. The button glows when the log shows something worth knowing.
an.log=Log also when CtrlMuxr is closed
an.log.tip=The proxy logs only while CtrlMuxr is running, so a finished setup does not slow the game down. Turn this on to log the selected game also without CtrlMuxr, for example to catch a problem that only appears when the game is started from Steam. Applies within a couple of seconds. The log is limited (about 200 lines a second, at most 5 MB); turn it off when it is not needed. Problems are always kept in dinput_errors.log.
an.title=Analysis – {0}
an.intro=Log: {0} ({1}). What the proxy gave the game. The log cannot show what the game accepted, so answer the questions below.
an.nolog=No log yet: start the game once with the proxy installed, then close it.
an.f.none=Nothing unusual in the log or the settings.
an.f.stale=The settings were changed after the last game session ({0}). Start the game again, then analyse.
an.f.bad=The proxy ignored this INI line: {0}
an.f.srcfail=A source device could not be used: {0} – plug it in, or close the program holding it.
an.f.acq=The wheel could not be taken in exclusive mode (no force feedback): {0} – run Exclusive access test; if it fails, first turn off "Enable Steam Input for …" in Steam, and if that is not enough, close Steam completely and test again.
an.f.acqlost=The wheel or another device briefly lost access ({0}) but got it back. This is usually the game window not being in the foreground (e.g. Alt+Tab). Nothing to do.
an.f.notlisted=The game never listed {0}. It may be hidden in [Hide] or not connected.
an.f.wheelhidden=The wheel {0} is hidden from the game in [Hide]. Remove it from [Hide].
an.f.notopened=The game listed {0} but never opened it: the game did not choose this controller. Check the identity ([Identity]) or try the Logitech preset.
an.f.hiddenunused=Note: you have hidden the device "{0}" completely: nothing is mapped from it, so the game does not see it.
an.f.unmapped=Moved during the session but is not mapped: {0}.
an.f.nopass=The source of axis {0} moved, but the game's axis did not change. The mapping may not reach the game (check Mode and Invert).
an.f.nosrc=No values from the other devices were logged: they were not pressed or moved, or the log is from before the mapping.
